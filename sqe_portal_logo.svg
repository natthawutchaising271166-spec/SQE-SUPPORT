<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="shieldBg" x1="80" y1="10" x2="80" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <linearGradient id="outerBorder" x1="20" y1="15" x2="140" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="innerFacet" x1="40" y1="30" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="coreCyan" x1="50" y1="45" x2="110" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="60" y1="60" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="silverGloss" x1="80" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for High-Tech Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>

    <radialGradient id="ambientLight" cx="80" cy="50" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="80" cy="80" r="68" fill="url(#ambientLight)" filter="url(#neonGlow)" />

  <!-- Background Shield Body -->
  <path d="M80 14 L138 38 L138 88 C138 118 112 140 80 152 C48 140 22 118 22 88 L22 38 Z"
        fill="url(#shieldBg)"
        stroke="url(#outerBorder)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#softShadow)" />

  <!-- Shield Gloss Highlight (Top Half) -->
  <path d="M80 16 L135 39 L135 75 C108 65 52 65 25 75 L25 39 Z"
        fill="url(#silverGloss)" />

  <!-- Tech Grid / Radial Lines Inside Shield -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="20" x2="80" y2="145" stroke-dasharray="3 3" />
    <line x1="30" y1="80" x2="130" y2="80" stroke-dasharray="3 3" />
    <circle cx="80" cy="80" r="42" stroke-dasharray="4 4" fill="none" />
    <circle cx="80" cy="80" r="24" stroke-dasharray="2 2" fill="none" />
  </g>

  <!-- Precision Corner Reticles -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
    <path d="M35 52 L35 44 L43 44" fill="none" />
    <path d="M125 52 L125 44 L117 44" fill="none" />
    <path d="M35 98 L35 106 L43 106" fill="none" />
    <path d="M125 98 L125 106 L117 106" fill="none" />
  </g>

  <!-- Inner Geometric Quality Diamond / Tech Hexagon -->
  <path d="M80 34 L122 56 L122 84 L80 128 L38 84 L38 56 Z"
        fill="none"
        stroke="url(#innerFacet)"
        stroke-width="1.8"
        stroke-linejoin="round"
        opacity="0.85" />

  <!-- Stylized Geometric "S" Monogram Segment (Top Left to Center) -->
  <path d="M52 58 C52 50 62 46 80 46 C96 46 106 50 106 58 C106 66 94 69 82 72 C66 75 50 79 50 92 C50 106 66 112 80 112 C96 112 108 106 109 96"
        fill="none"
        stroke="url(#coreCyan)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Stylized "Q" Precision Loop & Indicator -->
  <ellipse cx="80" cy="79" rx="27" ry="25"
           fill="none"
           stroke="url(#outerBorder)"
           stroke-width="3"
           stroke-dasharray="50 12 18 10"
           transform="rotate(-25 80 79)" />

  <!-- Quality Star / Precision Spark in Center -->
  <g transform="translate(80, 79)">
    <!-- Central Glowing Diamond Core -->
    <path d="M0 -15 L4 -4 L15 0 L4 4 L0 15 L-4 4 L-15 0 L-4 -4 Z"
          fill="url(#coreCyan)"
          filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#0284c7" />
  </g>

  <!-- Engineering Wing Blades (WAP Action Vectors) -->
  <g fill="url(#coreCyan)" opacity="0.9">
    <!-- Left Blade -->
    <path d="M30 68 L48 76 L44 80 L28 72 Z" />
    <path d="M34 82 L46 88 L43 92 L32 86 Z" />
    <!-- Right Blade -->
    <path d="M130 68 L112 76 L116 80 L132 72 Z" />
    <path d="M126 82 L114 88 L117 92 L128 86 Z" />
  </g>

  <!-- Precision Caliper / Shield Anchor at Bottom -->
  <polygon points="80,140 73,124 87,124" fill="url(#outerBorder)" />
  <circle cx="80" cy="120" r="2.5" fill="#38bdf8" />

  <!-- Crisp Lettering Badge at the Base -->
  <rect x="42" y="126" width="76" height="14" rx="7" fill="#020617" stroke="#38bdf8" stroke-width="1.2" />
  <text x="80" y="136.5" fill="#f8fafc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="900" letter-spacing="1.8" text-anchor="middle">SQE • WAP</text>
</svg>
